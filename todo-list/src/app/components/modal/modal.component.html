
<div class="modal" *ngIf="isOpen" (click)="onClose()">
    <div class="modal__content" (click)="$event.stopPropagation()">
      <button class="close__btn" (click)="onClose()">&times;</button>
      
      <h2>{{ todo ? 'Изменить задачу' : 'Добавить новую задачу' }}</h2>
      
      <div class="form__group">
        <label>Название</label>
        <input type="text" [(ngModel)]="name" placeholder="Enter task title">
      </div>
      
      <div class="form__group">
        <label>Описание</label>
        <textarea [(ngModel)]="description" placeholder="Enter task description"></textarea>
      </div>
      
      <div class="modal__actions">
        <button class="cancel__btn" (click)="onClose()">Закрыть</button>
        <button class="save__btn" (click)="onSave()">Сохранить</button>
      </div>
    </div>
  </div>
